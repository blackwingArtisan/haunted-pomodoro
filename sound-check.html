<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Listen to every sound in Haunted Pomodoro and see its measured levels." />
    <meta name="theme-color" content="#0b0910" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Sound Check · Haunted Pomodoro</title>
  </head>
  <body>
    <main class="sound-check" id="main">
      <header class="sc-head">
        <p class="sc-kicker">Haunted Pomodoro</p>
        <h1>Sound Check</h1>
        <p class="sc-lede">
          Every sound in the house is synthesized live with Web Audio. Each one below is rendered offline at full volume
          and measured: it must peak between <span data-testid="limit-min"></span> and <span data-testid="limit-max"></span> dBFS
          and fade to below <span data-testid="limit-tail"></span> dBFS when it ends. Press Play to hear it.
        </p>
        <p class="sc-summary" data-testid="summary" aria-live="polite">Rendering…</p>
      </header>
      <ol class="sc-list" data-testid="sounds"></ol>
      <p class="sc-back"><a href="/">Back to the house</a></p>
    </main>
    <script type="module" src="/src/sound-check/main.ts"></script>
  </body>
</html>
